<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Fractal Generator</h1>
            <p>Explore the infinite beauty of mathematical fractals</p>
        </header>

        <div class="main-content">
            <div class="controls-panel">
                <div class="control-group">
                    <h3>Fractal Type</h3>
                    <select id="fractal-type">
                        <option value="mandelbrot">Mandelbrot Set</option>
                        <option value="julia">Julia Set</option>
                    </select>
                </div>

                <div class="control-group">
                    <h3>Image Settings</h3>
                    <label>
                        Width:
                        <input type="number" id="width" value="800" min="100" max="2000">
                    </label>
                    <label>
                        Height:
                        <input type="number" id="height" value="600" min="100" max="2000">
                    </label>
                    <label>
                        Max Iterations:
                        <input type="number" id="max-iter" value="100" min="10" max="1000">
                    </label>
                </div>

                <div class="control-group">
                    <h3>View Controls</h3>
                    <label>
                        Zoom:
                        <input type="range" id="zoom" min="0.1" max="100" step="0.1" value="1">
                        <span id="zoom-value">1.0</span>
                    </label>
                    <label>
                        Center X:
                        <input type="number" id="center-x" value="0" step="0.01">
                    </label>
                    <label>
                        Center Y:
                        <input type="number" id="center-y" value="0" step="0.01">
                    </label>
                </div>

                <div class="control-group julia-controls" style="display: none;">
                    <h3>Julia Set Parameters</h3>
                    <label>
                        C Real:
                        <input type="number" id="julia-c-real" value="-0.7" step="0.01">
                    </label>
                    <label>
                        C Imaginary:
                        <input type="number" id="julia-c-imag" value="0.27015" step="0.01">
                    </label>
                </div>

                <div class="control-group">
                    <h3>Color Scheme</h3>
                    <select id="color-scheme">
                        <option value="classic">Classic</option>
                        <option value="fire">Fire</option>
                        <option value="ocean">Ocean</option>
                        <option value="grayscale">Grayscale</option>
                    </select>
                </div>

                <div class="control-group">
                    <button id="generate-btn" class="generate-button">Generate Fractal</button>
                    <button id="reset-btn" class="reset-button">Reset View</button>
                </div>

                <div class="control-group">
                    <h3>Presets</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" data-preset="mandelbrot-default">Mandelbrot Classic</button>
                        <button class="preset-btn" data-preset="mandelbrot-zoom">Mandelbrot Detail</button>
                        <button class="preset-btn" data-preset="julia-spiral">Julia Spiral</button>
                        <button class="preset-btn" data-preset="julia-dendrite">Julia Dendrite</button>
                    </div>
                </div>
            </div>

            <div class="fractal-display">
                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Generating fractal...</p>
                </div>
                <canvas id="fractal-canvas" width="800" height="600"></canvas>
                <div class="canvas-info">
                    <div class="zoom-indicator" id="zoom-indicator">🔍 Smooth Zoom Active</div>
                    <p id="generation-time"></p>
                    <p>Click and drag to pan • Scroll to zoom</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Built with Rust 🦀 and modern web technologies</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
