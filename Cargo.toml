[package]
name = "fractal-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
num-complex = "0.4"
rayon = "1.7"
clap = { version = "4.0", features = ["derive"] }
